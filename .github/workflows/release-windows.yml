name: Release Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: npm run verify
      - name: Build Windows installer
        run: npx electron-builder --win nsis --publish never
      - name: Normalize update asset names
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          Copy-Item "dist/Home Hospital Platform Setup $version.exe" "dist/Home-Hospital-Platform-Setup-$version.exe" -Force
          Copy-Item "dist/Home Hospital Platform Setup $version.exe.blockmap" "dist/Home-Hospital-Platform-Setup-$version.exe.blockmap" -Force
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          gh release create "v$version" --repo "$env:GITHUB_REPOSITORY" --title "Home Hospital Platform v$version" --notes "Windows auto-update release." "dist/Home-Hospital-Platform-Setup-$version.exe" "dist/Home-Hospital-Platform-Setup-$version.exe.blockmap" "dist/latest.yml"

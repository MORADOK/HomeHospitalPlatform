<!doctype html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Hospital Platform</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="appbar">
  <div class="brand"><div class="brand-mark"><img src="logo.png" alt="Home Hospital logo"></div><div class="brand-copy"><strong>Home Hospital</strong><span>Platform</span></div></div>
  <nav class="module-nav" aria-label="ระบบ">
    <button class="nav-item active" data-page="vaccine"><span>V</span><b>ระบบวัคซีน</b></button>
    <button class="nav-item" data-page="ua-online"><span>UA</span><b>UA Report</b></button>
    <button class="nav-item" data-page="documents-local"><span>DOC</span><b>บัตรนัด / ใบเสร็จ</b></button>
  </nav>
  <div class="top-actions">
    <section id="documents-status" class="documents-status" hidden><span id="documents-status-text">● DOC เชื่อมต่อแล้ว</span><button id="edit-documents-url" type="button">⚙</button></section>
    <section id="documents-settings" class="documents-settings" hidden><input id="documents-url" type="url" aria-label="ที่อยู่ระบบ DOC" placeholder="http://192.168.0.50:8501/" spellcheck="false"><button id="save-documents-url" type="button">บันทึก</button></section>
    <div id="update-pill" class="update-pill" title="ตรวจสอบอัปเดต"><span id="update-dot">●</span><span id="update-text">v0.1.0</span><button id="update-action" type="button">ตรวจอัปเดต</button></div>
    <div class="secure">● Secure</div>
  </div>
  <span id="page-title" class="sr-only">ระบบวัคซีน</span>
</header>
<main class="workspace"><div class="module-space" aria-hidden="true"></div><footer><span>Home Hospital Platform</span><span id="message">พร้อมใช้งาน</span></footer></main>
<script src="renderer.js"></script></body></html>
